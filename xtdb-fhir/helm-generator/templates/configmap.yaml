apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xtdb-fhir-generator.fullname" . }}-config
  labels:
    {{- include "xtdb-fhir-generator.labels" . | nindent 4 }}
data:
  # Patient generator configuration
  PATIENT_GENERATOR_POPULATION: {{ .Values.patientGenerator.population | quote }}
  PATIENT_GENERATOR_INTERVAL_SECONDS: {{ .Values.patientGenerator.intervalSeconds | quote }}

  # Spring datasource configuration (connects to XTDB)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/xtdb"
  SPRING_DATASOURCE_USERNAME: {{ .Values.database.user | quote }}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: {{ .Values.spring.datasource.hikari.maximumPoolSize | quote }}

  # Disable AWS Parameter Store for k8s deployment (config comes from ConfigMap)
  SPRING_CLOUD_AWS_PARAMETERSTORE_ENABLED: "false"

  # Logging
  LOGGING_LEVEL_ROOT: {{ .Values.logging.level | quote }}
