# Image configuration
image:
  repository: ""  # Set to your ECR repo via --set or Makefile
  tag: "latest"
  pullPolicy: Always

# Replica count (typically 1 for data generation)
replicaCount: 1

# Synthea generator configuration
synthea:
  # Number of patients to generate per interval
  population: 2
  # Interval between generation runs (in seconds)
  intervalSeconds: 10

# Database connection (XTDB)
database:
  # Internal Kubernetes DNS name for XTDB service
  host: "xtdb-service.xtdb-deployment.svc.cluster.local"
  port: 5432
  user: "xtdb"

# Spring datasource configuration
spring:
  datasource:
    hikari:
      maximumPoolSize: 10

# Resource limits - Synthea needs significant memory for patient generation
# Keep CPU request low to fit on cluster, but give plenty of memory
resources:
  requests:
    memory: "2Gi"
    cpu: "100m"
  limits:
    memory: "4Gi"
    cpu: "1000m"

# Pod scheduling
nodeSelector: {}
tolerations: []
affinity: {}

# Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Logging
logging:
  level: "INFO"

# Health checks (disabled - worker pod has no web server)
healthCheck:
  enabled: false
  initialDelaySeconds: 60
  periodSeconds: 30
