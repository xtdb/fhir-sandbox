patient-generator:
  population: 2
  interval-seconds: 10
  # Write target: 'xtdb' (INSERT … RECORDS, default) or 'postgres' (jsonb for CDC).
  target: xtdb

logging:
  level:
#    org.springframework.beans: DEBUG
    io.awspring.cloud.paramstore: DEBUG
    org.springframework.cloud.aws: DEBUG

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/xtdb
    username: xtdb
    password: xtdb
    hikari:
      connection-timeout: 5000
      data-source-properties:
        socketTimeout: 60
        connectTimeout: 5
        loginTimeout: 5
      maximum-pool-size: 20

  jmx:
    enabled: true

  cloud:
    aws:
      parameterstore:
        enabled: false

management:
  endpoints:
    jmx:
      exposure:
        include: '*'
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
