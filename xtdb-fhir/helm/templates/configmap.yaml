apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xtdb-fhir.fullname" . }}-config
  labels:
    {{- include "xtdb-fhir.labels" . | nindent 4 }}
data:
  # Database configuration
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_POOL_SIZE: {{ .Values.database.poolSize | quote }}
  DB_POOL_TIMEOUT: {{ .Values.database.poolTimeout | quote }}

  # Import configuration
  IMPORT_BATCH_SIZE: {{ .Values.import.batchSize | quote }}

  # Logging
  LOGGING_LEVEL: {{ .Values.logging.level | quote }}
