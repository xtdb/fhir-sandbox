server:
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      # Set a static private IP address for the load balancer, that will persist across reboots for Grafana to connect to!
      service.beta.kubernetes.io/aws-load-balancer-private-ipv4-addresses: "10.0.4.200"
      service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0fea78d9788180ab5"
  persistentVolume:
    enabled: false

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

extraScrapeConfigs: |
  - job_name: 'xtdb'
    static_configs:
      - targets:
        - 'xtdb-statefulset-0.xtdb-service.xtdb-deployment.svc.cluster.local:8080'
        - 'xtdb-statefulset-1.xtdb-service.xtdb-deployment.svc.cluster.local:8080'
        - 'xtdb-statefulset-2.xtdb-service.xtdb-deployment.svc.cluster.local:8080'