# Base configuration (production defaults)
# For dev/lighter resources: helm upgrade xtdb ./helm -f values.yaml -f values-dev.yaml

nodeCount: 3  # Dev: use 1 node via values-dev.yaml

image:
  repository: ghcr.io/xtdb/xtdb-aws
  tag: g86526b7
  pullPolicy: Always

nodeSelector:
  node_pool: "xtdbpool"

tolerations: []

affinity: {}

# Production resources for m6i.xlarge nodes (16GB RAM)
# Dev: use values-dev.yaml for lighter resources (2G memory for t4g.medium)
resources:
  limits:
    cpu: "1000m"
    memory: "10G"
    ephemeral-storage: 40Gi
  requests:
    cpu: "750m"
    memory: "10G"
    ephemeral-storage: 40Gi

podSecurityContext:
  runAsUser: 20000
  runAsGroup: 20000
  fsGroup: 20000
  runAsNonRoot: true

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

xtdbConfig:
  # REQUIRED
  # Kubernetes Service Account configured with Workload Identity Federation wih access to Azure Storage
  serviceAccount: ""
  # AWS S3 Bucket Name
  s3Bucket: ""

  # PostgreSQL credentials for remote query sources (the in-cluster Bitnami
  # release). Injected as PGUSER / PGPASSWORD env vars and referenced from
  # nodeConfig's `remotes` section via !Env. Set to null to disable.
  postgres:
    username: postgres
    # Secret created by the Bitnami postgresql chart, holding the password
    secretName: postgresql
    secretKey: postgres-password

  # Kafka bootstrap servers
  kafkaBootstrapServers: "kafka-kafka-bootstrap.xtdb-deployment.svc.cluster.local:9092"
  # XTDB log topic on Kafka 
  kafkaLogTopic: "xtdb-log"

  # OPTIONAL
  # JDK options - ensure that heap + direct memory + metaspace <= memory limit, and that some overhead is left for the OS
  # See https://docs.oracle.com/cd/E13150_01/jrockit_jvm/jrockit/jrdocs/refman/optionX.html
  # Production: heap (3G) + direct memory (3G) + metaspace (500m) = ~6.5GB per pod
  # Dev: use values-dev.yaml for lighter JVM settings (-Xmx1000m -Xms1000m -XX:MaxDirectMemorySize=512m -XX:MaxMetaspaceSize=256m)
  jdkOptions: "-Xmx3000m -Xms3000m -XX:MaxDirectMemorySize=3000m -XX:MaxMetaspaceSize=500m"

  # We mount and use the below YAML for configuring the XTDB nodes and their modules.
  # The !Env values are set by Environment Variables set on the XTDB statefulset pods.
  # See the XTDB configuration documentation for options: https://docs.xtdb.com/ops/config.html
  nodeConfig: |-
    server:
      host: '*'
      port: 5432

    flightSql:
      host: '*'
      port: 9832

    logClusters:
      kafkaCluster: !Kafka
        bootstrapServers: "kafka-kafka-bootstrap.xtdb-deployment.svc.cluster.local:9092"

    log: !Kafka
      cluster: kafkaCluster
      topic: "xtdb-log"
      epoch: 3 # Used to reset the transaction log tracking and allow recovery.
      termEpoch: 1 # Declares that the Kafka consumer group behind leader election was recreated - bump, never lower.

    storage: !Remote
      objectStore: !S3
        bucket: "xtdb-bucket"
        prefix: xtdb-object-store

    remotes:
      cdc: !Postgres
        hostname: postgresql.xtdb-deployment.svc.cluster.local
        port: 5432
        database: cdc
        username: !Env PGUSER
        password: !Env PGPASSWORD

    diskCache:
      path: /var/lib/xtdb/buffers/disk-cache
      maxSizeBytes: 30064771072  # 28 GiB (leave headroom below 35 GiB EmptyDir limit)

    healthz:
      host: '*'
      port: 8080

    garbageCollector:
      enabled: true
      blocksToKeep: 10
      garbageLifetime: PT24H

  # Volume size settings for XTDB Local Disk Cache (uses ephemeral storage)
  # Dev: use values-dev.yaml for smaller cache (5Gi)
  localDiskCache:
    sizeLimit: "35Gi"

  # Extra Env:
  env:
    # (ENV_VAR_NAME: Value)
    XTDB_LOGGING_LEVEL: "info" # See https://docs.xtdb.com/ops/troubleshooting/overview.html

  # Extra EnvFrom sources
  envFrom: []

startupProbe:
  httpGet:
    path: /healthz/started
    port: 8080
  periodSeconds: 30
  failureThreshold: 10 

livenessProbe:
  httpGet:
    path: /healthz/alive
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

xtdbService:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0fea78d9788180ab5"
  server:
    # Port of the Postgres Wire Server on the nodes
    targetPort: 5432
    # Port exposed by the service
    servicePort: 5432
  flightSqlServer:
    # Port of the Flight SQL server on the nodes
    targetPort: 9832
    # Port exposed by the service
    servicePort: 9832
  healthzServer:
    # Port of the healthz server on the nodes
    targetPort: 8080
    # Port exposed by the service
    servicePort: 8080
