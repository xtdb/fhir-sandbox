# Original from: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Container-Insights-setup-EKS-quickstart.html
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: amazon-cloudwatch
  labels:
    k8s-app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Grace                     30
        Log_Level                 error
        Daemon                    off
        Parsers_File              parsers.conf
        HTTP_Server               ${HTTP_SERVER}
        HTTP_Listen               0.0.0.0
        HTTP_Port                 ${HTTP_PORT}
        storage.path              /var/fluent-bit/state/flb-storage/
        storage.sync              normal
        storage.checksum          off
        storage.backlog.mem_limit 5M

    @INCLUDE application-log.conf
    @INCLUDE dataplane-log.conf
    @INCLUDE host-log.conf

  application-log.conf: |
    [INPUT]
        Name                tail
        Tag                 application.*
        Exclude_Path        /var/log/containers/cloudwatch-agent*, /var/log/containers/fluent-bit*, /var/log/containers/aws-node*, /var/log/containers/kube-proxy*, /var/log/containers/fluentd*
        Path                /var/log/containers/*.log
        multiline.parser    docker, cri
        DB                  /var/fluent-bit/state/flb_container.db
        Mem_Buf_Limit       50MB
        Skip_Long_Lines     On
        Refresh_Interval    10
        Rotate_Wait         30
        storage.type        filesystem
        Read_from_Head      ${READ_FROM_HEAD}

    [INPUT]
        Name                tail
        Tag                 application.*
        Path                /var/log/containers/fluent-bit*
        multiline.parser    docker, cri
        DB                  /var/fluent-bit/state/flb_log.db
        Mem_Buf_Limit       5MB
        Skip_Long_Lines     On
        Refresh_Interval    10
        Read_from_Head      ${READ_FROM_HEAD}

    [INPUT]
        Name                tail
        Tag                 application.*
        Path                /var/log/containers/cloudwatch-agent*
        multiline.parser    docker, cri
        DB                  /var/fluent-bit/state/flb_cwagent.db
        Mem_Buf_Limit       5MB
        Skip_Long_Lines     On
        Refresh_Interval    10
        Read_from_Head      ${READ_FROM_HEAD}

    [FILTER]
        Name                kubernetes
        Match               application.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_Tag_Prefix     application.var.log.containers.
        Merge_Log           On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Labels              Off
        Annotations         Off
        Use_Kubelet         On
        Kubelet_Port        10250
        Buffer_Size         0

    # Multiline first (concatenate stack traces), then parse
    # XTDB and apps doing similar logging
    [FILTER]
        Name                multiline
        Match_Regex         application\.var\.log\.containers\.(xtdb-statefulset|xtdb-fhir-generator|xtdb-fhir-guardrails)-.*
        multiline.key_content log
        multiline.parser    java_multiline
    [FILTER]
        Name                parser
        Match_Regex         application\.var\.log\.containers\.(xtdb-statefulset|xtdb-fhir-generator|xtdb-fhir-guardrails)-.*
        Key_Name            log
        Parser              xtdb
        Reserve_Data        On

    # Kafka/Strimzi
    [FILTER]
        Name                multiline
        Match_Regex         application\.var\.log\.containers\.(kafka|strimzi).*
        multiline.key_content log
        multiline.parser    java_multiline
    [FILTER]
        Name                parser
        Match_Regex         application\.var\.log\.containers\.(kafka|strimzi).*
        Key_Name            log
        Parser              kafka
        Reserve_Data        On

    [OUTPUT]
        Name                cloudwatch_logs
        Match               application.*
        region              ${AWS_REGION}
        log_group_name      /aws/containerinsights/${CLUSTER_NAME}/application
        log_stream_prefix   ${HOST_NAME}-
        auto_create_group   true
        extra_user_agent    container-insights

  dataplane-log.conf: |
    [INPUT]
        Name                systemd
        Tag                 dataplane.systemd.*
        Systemd_Filter      _SYSTEMD_UNIT=docker.service
        Systemd_Filter      _SYSTEMD_UNIT=containerd.service
        Systemd_Filter      _SYSTEMD_UNIT=kubelet.service
        DB                  /var/fluent-bit/state/systemd.db
        Path                /var/log/journal
        Read_From_Tail      ${READ_FROM_TAIL}

    [INPUT]
        Name                tail
        Tag                 dataplane.tail.*
        Path                /var/log/containers/aws-node*, /var/log/containers/kube-proxy*
        multiline.parser    docker, cri
        DB                  /var/fluent-bit/state/flb_dataplane_tail.db
        Mem_Buf_Limit       50MB
        Skip_Long_Lines     On
        Refresh_Interval    10
        Rotate_Wait         30
        storage.type        filesystem
        Read_from_Head      ${READ_FROM_HEAD}

    [FILTER]
        Name                modify
        Match               dataplane.systemd.*
        Rename              _HOSTNAME                   hostname
        Rename              _SYSTEMD_UNIT               systemd_unit
        Rename              MESSAGE                     message
        Remove_regex        ^((?!hostname|systemd_unit|message).)*$

    [FILTER]
        Name                aws
        Match               dataplane.*
        imds_version        v2

    [OUTPUT]
        Name                cloudwatch_logs
        Match               dataplane.*
        region              ${AWS_REGION}
        log_group_name      /aws/containerinsights/${CLUSTER_NAME}/dataplane
        log_stream_prefix   ${HOST_NAME}-
        auto_create_group   true
        extra_user_agent    container-insights

  host-log.conf: |
    [INPUT]
        Name                systemd
        Tag                 host.dmesg
        Systemd_Filter      _TRANSPORT=kernel
        DB                  /var/fluent-bit/state/flb_dmesg.db
        Path                /var/log/journal
        Read_From_Tail      ${READ_FROM_TAIL}

    [INPUT]
        Name                systemd
        Tag                 host.messages
        Systemd_Filter      PRIORITY=0
        Systemd_Filter      PRIORITY=1
        Systemd_Filter      PRIORITY=2
        Systemd_Filter      PRIORITY=3
        Systemd_Filter      PRIORITY=4
        Systemd_Filter      PRIORITY=5
        Systemd_Filter      PRIORITY=6
        DB                  /var/fluent-bit/state/flb_messages.db
        Path                /var/log/journal
        Read_From_Tail      ${READ_FROM_TAIL}

    [INPUT]
        Name                systemd
        Tag                 host.secure
        Systemd_Filter      SYSLOG_FACILITY=10
        DB                  /var/fluent-bit/state/flb_secure.db
        Path                /var/log/journal
        Read_From_Tail      ${READ_FROM_TAIL}

    [FILTER]
        Name                aws
        Match               host.*
        imds_version        v2

    [FILTER]
        Name                grep
        Match               host.messages
        Exclude             SYSLOG_FACILITY /^(2|9|10)$/

    [FILTER]
        Name                modify
        Match               host.*
        Rename             _HOSTNAME host
        Rename             MESSAGE message
        Rename             SYSLOG_IDENTIFIER ident
        Rename             SYSLOG_PID pid
        Remove_regex       [A-Z]

    [OUTPUT]
        Name                cloudwatch_logs
        Match               host.*
        region              ${AWS_REGION}
        log_group_name      /aws/containerinsights/${CLUSTER_NAME}/host
        log_stream_prefix   ${HOST_NAME}.
        auto_create_group   true
        extra_user_agent    container-insights

  parsers.conf: |
    [PARSER]
        Name                syslog
        Format              regex
        Regex               ^(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$
        Time_Key            time
        Time_Format         %b %d %H:%M:%S

    [PARSER]
        Name                container_firstline
        Format              regex
        Regex               (?<log>(?<="log":")\S(?!\.).*?)(?<!\\)".*(?<stream>(?<="stream":").*?)".*(?<time>\d{4}-\d{1,2}-\d{1,2}T\d{2}:\d{2}:\d{2}\.\w*).*(?=})
        Time_Key            time
        Time_Format         %Y-%m-%dT%H:%M:%S.%LZ

    [PARSER]
        Name                cwagent_firstline
        Format              regex
        Regex               (?<log>(?<="log":")\d{4}[\/-]\d{1,2}[\/-]\d{1,2}[ T]\d{2}:\d{2}:\d{2}(?!\.).*?)(?<!\\)".*(?<stream>(?<="stream":").*?)".*(?<time>\d{4}-\d{1,2}-\d{1,2}T\d{2}:\d{2}:\d{2}\.\w*).*(?=})
        Time_Key            time
        Time_Format         %Y-%m-%dT%H:%M:%S.%LZ

    [PARSER]
        Name                xtdb
        Format              regex
        Regex               ^\d{2}:\d{2}:\d{2}\s+\|\s+(?<level>\w+)\s+(?<logger>[^\|]+?)\s*\|\s+(?<log>[\s\S]*)$

    [PARSER]
        Name                kafka
        Format              regex
        Regex               ^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+(?<level>\w+)\s+(?<log>[\s\S]*)$

    [MULTILINE_PARSER]
        name                java_multiline
        type                regex
        flush_timeout       1000
        # Start: logback format (HH:mm:ss | LEVEL logger | message)
        rule                "start_state"   "/^\d{2}:\d{2}:\d{2}\s+\|/"                                         "cont"
        # Start: date format (YYYY-MM-DD)
        rule                "start_state"   "/^\d{4}-\d{2}-\d{2}/"                                              "cont"
        # Continuation: lines starting with whitespace (stack frames, "... N more", Suppressed:)
        rule                "cont"          "/^\s+/"                                                            "cont"
        # Continuation: Caused by (not indented)
        rule                "cont"          "/^Caused by:/"                                                     "cont"
        # Continuation: Java exceptions (e.g., "java.lang.SomeClass:" or "SomeClass:")
        rule                "cont"          "/^[\w.$]+:/"                                                       "cont"