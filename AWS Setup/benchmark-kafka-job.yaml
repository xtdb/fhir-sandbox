apiVersion: batch/v1
kind: Job
metadata:
  name: bench-kafka
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: bench-kafka
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bench
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: KAFKA_BOOTSTRAP
              value: "KAFKA_BOOTSTRAP_PLACEHOLDER"
            - name: TOPIC
              value: "TOPIC_PLACEHOLDER"
            - name: TOTAL_MSGS
              value: "TOTAL_MSGS_PLACEHOLDER"
            - name: XTDB_HOST
              value: "XTDB_HOST_PLACEHOLDER"
            - name: XTDB_PORT
              value: "5432"
            - name: XTDB_DB
              value: "kafka_src"
            - name: XTDB_USER
              value: "xtdb"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
