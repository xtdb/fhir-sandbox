# Force Tempo to run in eu-west-1a (same AZ as the NLB static IP and the EBS volume it'll bind)
nodeSelector:
  topology.kubernetes.io/zone: eu-west-1a

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    # Set a static private IP address for the load balancer, that will persist across reboots for Grafana to connect to!
    service.beta.kubernetes.io/aws-load-balancer-private-ipv4-addresses: "10.0.4.201"
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0fea78d9788180ab5"

persistence:
  enabled: true
  storageClassName: gp2
  size: 10Gi

tempo:
  retention: 24h
