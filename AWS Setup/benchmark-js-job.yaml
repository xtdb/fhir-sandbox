apiVersion: batch/v1
kind: Job
metadata:
  name: bench-js
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: bench-js
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bench
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: XTDB_HOST
              value: "XTDB_HOST_PLACEHOLDER"
            - name: XTDB_PORT
              value: "5432"
            - name: XTDB_DB
              value: "xtdb"
            - name: XTDB_USER
              value: "xtdb"
            - name: MODE
              value: "MODE_PLACEHOLDER"
            - name: TOTAL_ROWS
              value: "TOTAL_ROWS_PLACEHOLDER"
            - name: ROWS_PER_TXN
              value: "ROWS_PER_TXN_PLACEHOLDER"
            - name: WARMUP_TXNS
              value: "WARMUP_TXNS_PLACEHOLDER"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL